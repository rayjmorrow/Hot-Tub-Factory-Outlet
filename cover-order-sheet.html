<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Completed Cover Order Form | HTFO</title><script src="store-config.js"></script><style>
:root{--navy:#082642;--blue:#278fc0;--line:#b8c3cc;--muted:#647380}*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#17212b;font-family:Arial,Helvetica,sans-serif}.toolbar{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:12px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}.toolbar button{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.page{width:8.5in;min-height:11in;margin:22px auto;background:#fff;padding:.38in .45in;box-shadow:0 4px 24px #0002}.header{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--navy);padding-bottom:10px}.brand{font-size:23px;font-weight:900;color:var(--navy)}.muted{font-size:11px;color:var(--muted)}h1{font-size:20px;margin:0;color:var(--navy);text-align:right}.section{border:1px solid var(--line);margin-top:10px}.section h2{margin:0;background:#eaf4f9;color:var(--navy);font-size:12px;padding:6px 8px;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(4,1fr)}.cell{min-height:42px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:5px 7px}.cell:nth-child(4n){border-right:0}.w2{grid-column:span 2}.w4{grid-column:span 4;border-right:0}.label{font-size:9px;font-weight:800;text-transform:uppercase;color:#697782;margin-bottom:3px}.value{font-size:12px;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}.measure{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:8px}.diagram{border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;min-height:155px;background:#fafcfd}.shape{width:180px;height:110px;border:5px solid var(--blue);position:relative}.shape.rounded{border-radius:24px}.shape.round{border-radius:50%;width:120px;height:120px}.shape:after{content:"HINGE / FOLD";position:absolute;top:50%;left:8px;right:8px;border-top:2px dashed #6e7d88;text-align:center;font-size:9px;color:#6e7d88;padding-top:3px}.measurements{display:grid;grid-template-columns:1fr 1fr;border-left:1px solid var(--line);border-top:1px solid var(--line)}.measurements .cell{border-bottom:1px solid var(--line)}.checks{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:8px;font-size:11px}.box{display:inline-grid;place-items:center;width:13px;height:13px;border:1px solid #333;margin-right:5px;font-weight:900}.box.on:after{content:"✓"}.signature{display:grid;grid-template-columns:2fr 1fr 1fr;gap:18px;margin-top:22px}.line{border-top:1px solid #333;padding-top:4px;font-size:9px;color:#5c6973}.error{padding:24px;color:#9b1c1c;font-weight:800}@media(max-width:900px){.page{width:100%;min-height:0;margin:0;box-shadow:none;padding:18px}.grid{grid-template-columns:1fr 1fr}.cell:nth-child(4n){border-right:1px solid var(--line)}.cell:nth-child(2n){border-right:0}.w2,.w4{grid-column:span 2}.measure{grid-template-columns:1fr}.toolbar{position:static}}@media print{body{background:#fff}.toolbar{display:none}.page{width:auto;min-height:auto;margin:0;box-shadow:none;padding:.2in}.section{break-inside:avoid}}
</style></head><body><div class="toolbar"><b>HTFO Completed Replacement Cover Form</b><button onclick="window.print()">Print / Save as PDF</button></div><main class="page" id="page"><div class="header"><div><div class="brand">Hot Tub Factory Outlet</div><div class="muted">Replacement Cover Order Worksheet · Monroeville & Wexford</div></div><div><h1>COVER ORDER FORM</h1><div class="muted" id="meta"></div></div></div><div id="content"><div class="error">Loading completed cover form…</div></div></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cell=(label,value,cls='')=>'<div class="cell '+cls+'"><div class="label">'+esc(label)+'</div><div class="value">'+esc(value||'—')+'</div></div>';
const values=(d,k)=>Array.isArray(d[k])?d[k]:d[k]?[d[k]]:[];
const checked=(on,label)=>'<div><span class="box '+(on?'on':'')+'"></span>'+esc(label)+'</div>';
(async()=>{
 try{
  const id=new URLSearchParams(location.search).get('id')||'';
  if(!id)throw new Error('No cover form ID was supplied.');
  const api=(window.HTFO_STORE_CONFIG?.apiBase||'').replace(/\/$/,'');
  const r=await fetch(api+'/cover-order-form/'+encodeURIComponent(id)),j=await r.json();
  if(!r.ok)throw new Error(j.error||'Cover form could not be loaded.');
  const d=j.form_data||{};
  document.querySelector('#meta').textContent=j.form_id+' · '+new Date(j.created_at).toLocaleString();
  const shape=String(d.shape||'Rounded Square'),shapeClass=/round$/i.test(shape)?'round':/rounded/i.test(shape)?'rounded':'';
  const opts=['Double Wrapped Foam Core','Full Length Insulation at the Seam','Reinforced Center','Extra Handles','Extra Long Skirt - Over 6 inches','Pair of Additional Straps','Speaker Hood Cut Outs','Oversize 2 Panel 97-108 inches'];
  document.querySelector('#content').innerHTML=
   '<section class="section"><h2>Spa Information</h2><div class="grid">'+cell('Brand',d.brand)+cell('Model',d.model)+cell('Approx. Year',d.year)+cell('Serial Number',d.serial)+cell('Old Cover Available',d.oldCover)+cell('Shape',d.shape)+cell('Radius Method',d.radiusMethod)+cell('Corner Style',d.cornerStyle)+'</div></section>'+
   '<section class="section"><h2>Shape & Measurements</h2><div class="measure"><div class="diagram"><div class="shape '+shapeClass+'"></div></div><div class="measurements">'+cell('A / Width',d.a?d.a+' in.':'')+cell('B / Length',d.b?d.b+' in.':'')+cell('C / Third Side',d.c?d.c+' in.':'')+cell('D / Fourth Side',d.d?d.d+' in.':'')+cell('Corner Radius',d.radius?d.radius+' in.':'')+cell('Diameter',d.diameter?d.diameter+' in.':'')+cell('Shape Notes',d.shapeNotes,'w2')+'</div></div></section>'+
   '<section class="section"><h2>Cover Specifications</h2><div class="grid">'+cell('Cover Model',j.cover_model)+cell('SKU',j.cover_sku)+cell('Price','$'+Number(j.cover_price||0).toFixed(2))+cell('Material',d.material)+cell('Color',d.color)+cell('Skirt',d.skirt?d.skirt+' in.':'')+cell('Hinge Direction',d.hingeDirection)+cell('Fold Orientation',d.foldOrientation)+cell('Hinge Offset',d.hingeOffset?d.hingeOffset+' in.':'')+cell('Strap Length',d.strapLength?d.strapLength+' in.':'')+cell('Strap Placement',d.strapPlacement)+cell('Cover Lifter',d.lifter)+cell('Detail Notes',d.coverDetailNotes,'w4')+'</div><div class="checks">'+opts.map(x=>checked(values(d,'factoryOption').includes(x),x)).join('')+'</div></section>'+
   '<section class="section"><h2>Customer</h2><div class="grid">'+cell('Name',d.name,'w2')+cell('Phone',d.phone)+cell('Email',d.email)+cell('ZIP',d.zip)+cell('Priorities',values(d,'priority').join(', '),'w2')+cell('Customer Notes',d.notes,'w4')+'</div></section>'+
   '<div class="muted" style="margin-top:10px"><b>Measurement verification required before ordering.</b> Confirm dimensions, radius, hinge/fold direction, skirt and strap placement before submitting to the manufacturer.</div><div class="signature"><div class="line">Customer / Ordered By</div><div class="line">Date</div><div class="line">PO / HTFO Initials</div></div>';
 }catch(e){document.querySelector('#content').innerHTML='<div class="error">'+esc(e.message)+'</div>'}
})();
</script></body></html>
