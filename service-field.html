<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b314f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="HTFO Field"><link rel="manifest" href="service-field-manifest.webmanifest"><title>HTFO Field Service</title><link rel="stylesheet" href="service-field.css"></head><body>
<div id="login" class="screen"><form id="loginForm" class="card login"><h1>HTFO Field Service</h1><p>Technician sign in</p><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in</button><div id="loginError" class="error"></div></form></div>
<div id="app" hidden><header><div><strong>HTFO Field</strong><small id="who"></small></div><button id="logout" class="ghost">Log out</button></header><main>
<section id="jobsView"><div class="toolbar"><div><h1>Today’s Jobs</h1><div id="todayLabel" class="muted"></div></div><label class="switch"><input id="showAll" type="checkbox"> Show all techs</label></div><div id="jobs" class="stack"></div></section>
<section id="jobView" hidden><button id="backJobs" class="ghost dark">← Today’s Jobs</button><div id="jobDetail"></div></section>
</main></div>
<dialog id="paymentDialog"><form method="dialog" id="paymentForm" class="sheet"><h2>Collect Payment</h2><div id="paymentInvoice"></div><label>Method<select id="payMethod"><option value="card">Credit / debit card</option><option value="cash">Cash</option><option value="check">Check</option></select></label><label>Amount<input id="payAmount" type="number" min="0.01" step="0.01" required></label><label id="checkWrap" hidden>Check #<input id="checkNo"></label><label>Note<input id="payNote" placeholder="Optional"></label><div class="actions"><button value="cancel" class="ghost dark">Cancel</button><button id="submitPayment" value="default" class="primary">Continue</button></div></form></dialog>
<script src="service-field.js"></script></body></html>
