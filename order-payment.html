<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay Your Hot Tub Factory Outlet Balance</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#17324d;margin:0}
main{max-width:620px;margin:8vh auto;padding:22px}
.card{background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(20,48,75,.08)}
h1{margin-top:0}.amount{font-size:2.2rem;font-weight:800;margin:18px 0}.muted{color:#66788a}
button{width:100%;padding:15px;border:0;border-radius:10px;background:#17365d;color:#fff;font-weight:800;font-size:1rem}
.error{color:#a12622}.ok{color:#166534;font-weight:800}
</style>
</head>
<body>
<main><div class="card">
<h1>Hot Tub Factory Outlet</h1>
<div id="status" class="muted">Preparing your secure payment…</div>
<div id="details"></div>
<button id="pay" hidden>Pay Balance Securely</button>
</div></main>
<script src="/order-payment.js"></script>
</body>
</html>
