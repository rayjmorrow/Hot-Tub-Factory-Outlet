<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay Your Hot Tub Factory Outlet Balance</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#17324d;margin:0}
main{max-width:620px;margin:8vh auto;padding:22px}
.card{background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(20,48,75,.08)}
h1{margin-top:0}.amount{font-size:2.2rem;font-weight:800;margin:18px 0}.muted{color:#66788a}
button{width:100%;padding:15px;border:0;border-radius:10px;background:#17365d;color:#fff;font-weight:800;font-size:1rem}
.error{color:#a12622}.ok{color:#166534;font-weight:800}
</style>
</head>
<body>
<main><div class="card">
<h1>Hot Tub Factory Outlet</h1>
<div id="status" class="muted">Preparing your secure payment…</div>
<div id="details"></div>
<button id="pay" hidden>Pay Balance Securely</button>
</div></main>
<script>
const qs=new URLSearchParams(location.search),token=qs.get('t'),status=document.getElementById('status'),details=document.getElementById('details'),pay=document.getElementById('pay');
let session=null;
async function start(){
  if(!token){status.innerHTML='<span class="error">This payment link is incomplete.</span>';return}
  try{
    const r=await fetch('/api/service/public/order-payment/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    const x=await r.json();
    if(!r.ok)throw new Error(x.error||'Unable to prepare payment');
    if(x.paid){status.innerHTML='<span class="ok">This order is already paid in full.</span>';details.innerHTML='<p>Order '+(x.order_number||'')+'</p>';return}
    session=x;status.textContent='Review your remaining balance below.';
    details.innerHTML='<div class="amount">'+Number(x.balance||0).toLocaleString('en-US',{style:'currency',currency:'USD'})+'</div><div class="muted">Order '+(x.order_number||'')+'</div><p>Your card information will be entered directly on the Authorize.Net secure payment page.</p>';
    pay.hidden=false;
  }catch(e){status.innerHTML='<span class="error">'+String(e.message||e)+'</span>'}
}
pay.onclick=()=>{
  if(!session)return;
  const f=document.createElement('form');f.method='POST';f.action=session.form_url;
  const i=document.createElement('input');i.type='hidden';i.name='token';i.value=session.token;f.appendChild(i);
  document.body.appendChild(f);f.submit();
};
start();
</script>
</body>
</html>
