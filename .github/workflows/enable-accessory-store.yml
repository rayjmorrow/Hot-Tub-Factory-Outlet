name: Enable accessory storefront
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-accessory-store.yml'
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add store script to accessories page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('accessories.html')
          s=p.read_text()
          if '<script src="store.js"></script>' not in s:
              s=s.replace('</body></html>','<script src="store.js"></script></body></html>')
              p.write_text(s)
          PY
      - name: Commit storefront enablement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accessories.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Turn chemicals and accessories into a storefront"
            git push
          fi