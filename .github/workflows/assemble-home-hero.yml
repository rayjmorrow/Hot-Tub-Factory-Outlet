name: Assemble homepage hero

on:
  push:
    branches: [main]
    paths:
      - '.hero-transfer2/**'
      - '.github/workflows/assemble-home-hero.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and validate hero
        shell: bash
        run: |
          if [ ! -f .hero-transfer2/part4.txt ]; then
            echo "No hero transfer to assemble."
            exit 0
          fi
          cat .hero-transfer2/part0.txt .hero-transfer2/part1.txt .hero-transfer2/part2.txt .hero-transfer2/part3.txt .hero-transfer2/part4.txt > /tmp/hero.b64
          base64 -d /tmp/hero.b64 > assets/htfo-home-backyard-hero.webp
          file assets/htfo-home-backyard-hero.webp
      - name: Commit working hero asset
        shell: bash
        run: |
          if [ ! -f assets/htfo-home-backyard-hero.webp ]; then
            exit 0
          fi
          rm -rf .hero-transfer2 .hero-transfer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Install working homepage backyard hero"
          git push
