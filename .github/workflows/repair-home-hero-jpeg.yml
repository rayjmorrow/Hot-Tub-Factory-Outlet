name: Repair homepage hero JPEG
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-home-hero-jpeg.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Make JPEG and update CSS
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          im=Image.open('assets/htfo-home-backyard-hero.webp').convert('RGB')
          im.save('assets/htfo-home-backyard-hero.jpg','JPEG',quality=90,optimize=True)
          p=Path('home.css')
          p.write_text(p.read_text().replace('assets/htfo-home-backyard-hero.webp','assets/htfo-home-backyard-hero.jpg'))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/htfo-home-backyard-hero.jpg home.css
          git commit -m "Repair homepage hero for Safari"
          git push
