name: Localize accessory images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-accessory-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - name: Add AquaSizer image and improve contrast
        run: |
          python - <<'PY'
          import io, re
          from pathlib import Path
          import requests
          from PIL import Image
          page=Path('accessories.html')
          html=page.read_text()
          html=html.replace('.hero h1{font-size:', '.hero h1{color:#fff;font-size:')
          html=html.replace('.hero p{font-size:', '.hero p{color:#fff;font-size:')
          url='https://www.hottubproducts.com/wp-content/uploads/2021/08/AquaSizer-LogoUSA.jpg'
          dest=Path('assets/accessories/hot-tub-products/aquasizer-logousa.webp')
          dest.parent.mkdir(parents=True,exist_ok=True)
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 HTFO Dealer Catalog'},timeout=30)
          r.raise_for_status()
          im=Image.open(io.BytesIO(r.content)).convert('RGB')
          im.thumbnail((1200,1200),Image.Resampling.LANCZOS)
          im.save(dest,'WEBP',quality=84,method=6)
          old='<div class="item" style="max-width:420px"><b>AquaSizer Underwater Treadmill</b><span>EXTM100</span><em>This Week’s Sale Price</em><strong>$1,899</strong></div>'
          new='<article class="card" style="max-width:520px"><div class="pic"><img src="assets/accessories/hot-tub-products/aquasizer-logousa.webp" alt="AquaSizer Underwater Treadmill"></div><div class="body"><h3>AquaSizer Underwater Treadmill</h3><p>No electricity or motor required. Walk or run at your own pace in a swim spa or swimming pool.</p><div class="sku">EXTM100</div><div class="sale">This Week’s Sale Price</div><div class="price">$1,899</div></div></article>'
          html=html.replace(old,new)
          page.write_text(html)
          PY
      - name: Commit local assets
        run: |
          git config user.name 'HTFO Site Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add accessories.html assets/accessories/hot-tub-products/aquasizer-logousa.webp
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Improve accessory hero and add AquaSizer image'; git push; fi
