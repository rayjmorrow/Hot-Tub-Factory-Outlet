name: Complete store catalog
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/store-catalog-completion.yml'
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete shoppable catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('accessories.html')
          s=p.read_text()
          s=s.replace("['TSLM111','Salt Test Strips · 12',10.99]]","['TSLM111','Salt Test Strips · 12',10.99],['TSAC103','Total Hardness Test Strips',17.99],['TSAC104','TDS Test Strips',17.99]]")
          s=s.replace("['CHSE300','Sediment Pre-Filter',12.99]]","['CHSE300','Sediment Pre-Filter',14.99],['CHSE300','Sediment Filter',12.99]]")
          # Add cover SKUs so they carry through cart and order details.
          cover_skus={
            'Economy 4 × 2':'CVTH100','Bronze 4 × 2.5':'CVTH200','Silver 4 × 2.5':'CVTH300','Gold 5 × 3':'CVTH400','Platinum 6 × 4':'CVTH500'
          }
          for name,sku in cover_skus.items():
            needle=f'<h3>{name}</h3>'
            if needle in s and f'<h3>{name}</h3><div class="sku">{sku}</div>' not in s:
              s=s.replace(needle,f'<h3>{name}</h3><div class="sku">{sku}</div>',1)
          # Remove the PDF used as an image on ConvertALift; keep a clean shoppable product card.
          s=s.replace('<div class="pic"><img src="https://www.hottubproducts.com/wp-content/uploads/2025/02/BrochureSpaEaseHotTubs2025.pdf" alt="ConvertALift automatic cover lifter"></div>','')
          # Add missing lifter/system SKUs before the lifter compatibility note.
          marker='</div><div class="note">Clearance and cabinet geometry matter. We’ll confirm compatibility before ordering a lifter.</div>'
          if 'VSL400' not in s:
            extra='''<article class="card"><div class="body"><h3>VacuSeal 400 Cover Lifter</h3><p>Premium VacuSeal-compatible cover lifter.</p><div class="sku">VSL400</div><div class="sale">This Week’s Sale Price</div><div class="price">$599</div></div></article>
<article class="card"><div class="body"><h3>VacuSeal 200 → 400 Conversion Kit</h3><p>Conversion kit for compatible VacuSeal lifter systems.</p><div class="sku">VSLA201</div><div class="sale">This Week’s Sale Price</div><div class="price">$249</div></div></article>
<article class="card"><div class="body"><h3>Swim Spa ConvertALift</h3><p>Powered cover-lifter solution for compatible swim spas.</p><div class="sku">CLP100SS</div><div class="sale">This Week’s Sale Price</div><div class="price">$2,795</div></div></article>
<article class="card"><div class="body"><h3>Hot Tub → Swim Spa ConvertALift Upgrade</h3><p>Upgrade package for compatible ConvertALift installations.</p><div class="sku">CLP100SS-UG</div><div class="sale">This Week’s Sale Price</div><div class="price">$1,299</div></div></article>
'''
            s=s.replace(marker,extra+marker,1)
          # Add the shorter deck-mount rail option.
          rail_marker='<article class="card"><div class="pic"><img src="assets/accessories/hot-tub-products/spaeasesafetyrail-deckmount.webp" alt="SpaEase Deck Mount Rail"></div><div class="body"><h3>Deck-Mount Rail</h3>'
          if 'RADM036' not in s and rail_marker in s:
            extra='<article class="card"><div class="body"><h3>Deck-Mount Rail · up to 22 in</h3><p>Compact deck-mount safety rail for lower spa installations.</p><div class="sku">RADM036</div><div class="sale">This Week’s Sale Price</div><div class="price">$189</div></div></article>\n'
            s=s.replace(rail_marker,extra+rail_marker,1)
          p.write_text(s)
          PY
      - name: Commit catalog completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accessories.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Complete shoppable chemicals accessories and covers catalog"
            git push
          fi