name: Add FROG ease storefront
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-frog-ease-store.yml'
permissions:
  contents: write
jobs:
  add-frog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image helpers
        run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Download manufacturer images and add products
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests, re
          from bs4 import BeautifulSoup
          from PIL import Image
          from io import BytesIO

          out=Path('assets/accessories/frog-ease')
          out.mkdir(parents=True,exist_ok=True)
          headers={'User-Agent':'Mozilla/5.0'}

          pages={
            'hot-tub-system':'https://www.frogproducts.com/product/frog-ease-floating-system/',
            'swim-spa-system':'https://www.frogproducts.com/product/frog-ease-sanitizing-system-for-swim-spas/'
          }

          def image_candidates(url):
            html=requests.get(url,headers=headers,timeout=30).text
            soup=BeautifulSoup(html,'html.parser')
            cand=[]
            for tag in soup.find_all('img'):
              src=tag.get('data-src') or tag.get('data-lazy-src') or tag.get('src')
              alt=(tag.get('alt') or '').lower()
              if src and src.startswith('//'): src='https:'+src
              if src and src.startswith('/'):
                src='https://www.frogproducts.com'+src
              if src and 'frogproducts.com/wp-content/uploads' in src:
                score=0
                text=(src+' '+alt).lower()
                for kw,w in [('ease',6),('smartchlor',8),('floating',5),('swim',5),('cartridge',8),('system',3),('product',2)]:
                  if kw in text: score+=w
                if any(bad in text for bad in ['icon','logo','swoosh','background','footer','pool-foreground','hot-tub-foreground']): score-=8
                cand.append((score,src,alt))
            return sorted(cand,reverse=True)

          def save_best(url,dest,prefer=()):
            cand=image_candidates(url)
            for score,src,alt in cand:
              text=(src+' '+alt).lower()
              bonus=sum(10 for x in prefer if x in text)
              if score+bonus < 1: continue
              try:
                r=requests.get(src,headers=headers,timeout=30)
                r.raise_for_status()
                im=Image.open(BytesIO(r.content)).convert('RGB')
                if im.width<180 or im.height<180: continue
                im.thumbnail((900,900))
                im.save(dest,'WEBP',quality=86,method=6)
                print(dest,src,im.size)
                return src
              except Exception as e:
                print('skip',src,e)
            raise RuntimeError('No suitable manufacturer image found for '+url)

          save_best(pages['hot-tub-system'],out/'hot-tub-floating-system.webp',('floating','system'))
          save_best(pages['hot-tub-system'],out/'hot-tub-smartchlor-3-pack.webp',('smartchlor','cartridge'))
          save_best(pages['swim-spa-system'],out/'swim-spa-floating-system.webp',('swim','system'))
          save_best(pages['swim-spa-system'],out/'swim-spa-smartchlor-refill.webp',('smartchlor','cartridge'))

          p=Path('accessories.html')
          s=p.read_text()
          if 'frog-ease-featured' not in s:
            marker='<section class="section alt" id="chemicals">'
            frog='''<section class="section alt frog-ease-featured" id="frog-ease"><div class="wrap"><div class="head"><span class="eyebrow">Our preferred water-care program</span><h2>FROG @ease Water Care</h2><p>Our preferred easy-care system for hot tubs and swim spas. FROG @ease combines FROG Minerals with self-regulating SmartChlor technology, uses up to 75% less chlorine than standard hot-tub chlorine systems, and makes routine water care much simpler.</p></div><div class="grid">
<article class="card"><div class="pic"><img src="assets/accessories/frog-ease/hot-tub-floating-system.webp" alt="FROG @ease Floating Sanitizing System for Hot Tubs"></div><div class="body"><h3>FROG @ease Floating System · Hot Tubs</h3><p>Complete floating mineral + SmartChlor sanitizing system for hot tubs. Self-regulates and flips when the SmartChlor cartridge needs attention.</p><div class="sku">FROG-HT-SYSTEM</div><div class="sale">This Week’s Sale Price</div><div class="price">$57.99</div></div></article>
<article class="card"><div class="pic"><img src="assets/accessories/frog-ease/hot-tub-smartchlor-3-pack.webp" alt="FROG @ease SmartChlor Replacement Cartridges 3 Pack"></div><div class="body"><h3>FROG @ease SmartChlor Refills · 3 Pack</h3><p>Three replacement SmartChlor cartridges for the FROG @ease Floating System for hot tubs.</p><div class="sku">FROG-HT-3PK</div><div class="sale">This Week’s Sale Price</div><div class="price">$57.99</div></div></article>
<article class="card"><div class="pic"><img src="assets/accessories/frog-ease/swim-spa-floating-system.webp" alt="FROG @ease Sanitizing System for Swim Spas"></div><div class="body"><h3>FROG @ease Floating System · Swim Spas</h3><p>Complete floating FROG @ease sanitizing system designed specifically for swim spas.</p><div class="sku">FROG-SS-SYSTEM</div><div class="sale">This Week’s Sale Price</div><div class="price">$134.99</div></div></article>
<article class="card"><div class="pic"><img src="assets/accessories/frog-ease/swim-spa-smartchlor-refill.webp" alt="FROG @ease SmartChlor Swim Spa Replacement Cartridge"></div><div class="body"><h3>FROG @ease SmartChlor Refill · Swim Spa</h3><p>Single replacement SmartChlor cartridge for the FROG @ease Sanitizing System for Swim Spas.</p><div class="sku">FROG-SS-REFILL</div><div class="sale">This Week’s Sale Price</div><div class="price">$46.99</div></div></article>
</div><div class="note"><strong>Why we prefer FROG @ease:</strong> self-regulating SmartChlor, up to 75% less chlorine, and less day-to-day chemical handling.</div></div></section>\n'''
            s=s.replace(marker,frog+marker,1)
          # Make FROG the first destination in the water-care department tile.
          s=s.replace('<a class="dept" href="#chemicals"><small>Water care</small>Spa Chemicals</a>','<a class="dept" href="#frog-ease"><small>Preferred water care</small>FROG @ease</a><a class="dept" href="#chemicals"><small>Traditional water care</small>Spa Chemicals</a>',1)
          p.write_text(s)
          PY
      - name: Commit FROG ease storefront
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accessories.html assets/accessories/frog-ease
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Feature FROG ease water care in storefront"
            git push
          fi
