name: Fix storefront asset loading
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-storefront-assets.yml'
permissions:
  contents: write
jobs:
  fix-storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire LIFE products and bust cached storefront assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('accessories.html')
          s=p.read_text()
          s=s.replace('<script src="store.js"></script></body></html>', '<script src="store.js?v=20260901-3"></script><script src="life-products.js?v=20260901-1"></script></body></html>')
          s=s.replace('<script src="store.js"></script><script src="life-products.js"></script></body></html>', '<script src="store.js?v=20260901-3"></script><script src="life-products.js?v=20260901-1"></script></body></html>')
          s=s.replace('<script src="store.js?v=20260901-2"></script>', '<script src="store.js?v=20260901-3"></script>')
          p.write_text(s)
          PY
      - name: Commit storefront loader fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accessories.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Load LIFE products and refresh FROG storefront assets"
            git push
          fi
