name: Publish HTFO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out HTFO website
        uses: actions/checkout@v4
      - name: Verify essential HTFO pages before publishing
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html hot-tubs.html hot-tubs-pittsburgh-pa.html hot-tubs-wexford-pa.html hot-tubs-monroeville-pa.html wexford-location.html wexford-location/index.html sitemap.xml CNAME .nojekyll; do
            test -f "$file" || { echo "::error file=$file::Missing file required for HTFO publication"; exit 1; }
          done
          grep -Fq 'hottubfactoryoutlet.com' CNAME
          grep -Fq 'Hot tubs for sale near Pittsburgh.' hot-tubs.html
          grep -Fq 'Hot tubs for sale near Pittsburgh, PA' hot-tubs-pittsburgh-pa.html
          grep -Fq 'hot-tubs-monroeville-pa.html' sitemap.xml
          echo "Validated site files for commit $GITHUB_SHA"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed HTFO pages
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            catalog=$(curl -fsSL --max-time 20 "https://hottubfactoryoutlet.com/hot-tubs.html?deploy_check=$GITHUB_SHA" || true)
            monroeville=$(curl -fsSL --max-time 20 "https://hottubfactoryoutlet.com/hot-tubs-monroeville-pa.html?deploy_check=$GITHUB_SHA" || true)
            wexford=$(curl -fsSL --max-time 20 "https://hottubfactoryoutlet.com/wexford-location/?deploy_check=$GITHUB_SHA" || true)
            if grep -Fq 'Hot tubs for sale near Pittsburgh.' <<< "$catalog" &&
               grep -Fq 'Hot tubs for sale in Monroeville' <<< "$monroeville" &&
               grep -Fq 'Our Wexford showroom page has moved' <<< "$wexford"; then
              echo "Live HTFO SEO pages verified for commit $GITHUB_SHA"
              exit 0
            fi
            echo "Public pages have not updated yet (check $i of 5)"
            sleep 12
          done
          echo "::error::Deployed site does not expose the expected HTFO SEO pages. Check Pages domain mapping and publishing configuration."
          exit 1
