name: Check store payment connection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/store-payment-config.js'
      - 'backend/store-payment-config.test.js'
      - 'backend/check-store-payment-auth.js'
      - '.github/workflows/check-store-payments.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test credential handling and Pennsylvania tax rules
        run: |
          node backend/store-payment-config.test.js
          node backend/store-sales-tax.test.js
          node tests/customer-flows.test.cjs
      - name: Check live gateway authentication without charging a card
        env:
          AUTHORIZE_SANDBOX: 'false'
          AUTHORIZE_API_LOGIN_ID: ${{ secrets.AUTHORIZE_API_LOGIN_ID }}
          AUTHORIZE_TRANSACTION_KEY: ${{ secrets.AUTHORIZE_TRANSACTION_KEY }}
          AUTHORIZENET_API_LOGIN_ID: ${{ secrets.AUTHORIZENET_API_LOGIN_ID }}
          AUTHORIZENET_TRANSACTION_KEY: ${{ secrets.AUTHORIZENET_TRANSACTION_KEY }}
        run: node backend/check-store-payment-auth.js
