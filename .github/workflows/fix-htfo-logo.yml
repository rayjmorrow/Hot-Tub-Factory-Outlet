name: Fix HTFO header logo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use optimized visible HTFO logo asset
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text()
              n=s.replace('assets/htfo-logo.png','assets/htfo-logo.webp')
              if n != s:
                  p.write_text(n)
                  changed.append(str(p))
          print('Updated:', ', '.join(changed))
          PY
      - name: Commit logo fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Use optimized HTFO logo across site"
          git push
