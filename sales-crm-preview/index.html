<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTFO Live Sales CRM</title><style>
:root{--navy:#082642;--blue:#0b79b7;--bg:#f3f6f8;--line:#dbe4ea;--green:#14804a;--red:#b42318;--muted:#617181}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:#172331}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(140deg,var(--navy),#0d5682)}.login-card{background:#fff;padding:30px;border-radius:20px;width:min(420px,100%);box-shadow:0 24px 70px #001a2d66}.login-card h1{margin:0 0 6px;color:var(--navy)}label{display:block;font-weight:700;font-size:13px;margin:16px 0 6px}input,select{width:100%;padding:12px;border:1px solid #b9c8d2;border-radius:9px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.login .btn{width:100%;margin-top:18px}.error{color:var(--red);font-size:13px;margin-top:12px}.app{display:none;min-height:100vh}.top{background:var(--navy);color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}.top h1{font-size:21px;margin:0}.top small{display:block;color:#b9d3e4;margin-top:3px}.ghost{background:#ffffff16;color:#fff;border:1px solid #ffffff40}.wrap{max-width:1500px;margin:auto;padding:22px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px #17324d0c}.kpi{padding:17px}.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}.kpi b{display:block;font-size:31px;color:var(--navy);margin-top:5px}.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0;flex-wrap:wrap}.toolbar input{max-width:340px}.toolbar select{max-width:200px}.status{margin-left:auto;font-size:13px;color:var(--muted)}.pipeline{display:grid;grid-template-columns:repeat(7,minmax(235px,1fr));gap:10px;overflow:auto;padding-bottom:12px}.column{background:#e8edf1;border-radius:13px;padding:10px;min-height:210px}.column h2{font-size:13px;margin:3px 2px 11px;display:flex;justify-content:space-between}.count{background:#fff;border-radius:999px;padding:2px 8px;color:var(--muted)}.lead{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px}.lead strong{color:var(--navy)}.meta{font-size:12px;color:var(--muted);margin-top:5px;word-break:break-word}.delivery{font-size:11px;margin-top:8px}.ok{color:var(--green)}.bad{color:var(--red)}.lead select{margin-top:9px;padding:7px;font-size:12px}.table-card{margin-top:18px;padding:16px;overflow:auto}.table-card h2{margin:0 0 12px;font-size:17px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf1f4;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:var(--muted)}.empty{color:var(--muted);padding:18px;text-align:center}@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.wrap{padding:14px}.pipeline{grid-template-columns:repeat(7,260px)}}
</style></head><body><section class="login" id="login"><form class="login-card" id="loginForm"><h1>HTFO Sales CRM</h1><p>Live website leads and HighLevel delivery status.</p><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button class="btn primary">Sign In</button><div class="error" id="loginError"></div></form></section><main class="app" id="app"><header class="top"><div><h1>HTFO Live Sales CRM</h1><small id="who">Website leads · Monroeville & Wexford</small></div><button class="btn ghost" id="logout">Sign Out</button></header><div class="wrap"><section class="kpis"><div class="card kpi"><span>Open leads</span><b id="open">—</b></div><div class="card kpi"><span>Last 24 hours</span><b id="day">—</b></div><div class="card kpi"><span>Last 7 days</span><b id="week">—</b></div><div class="card kpi"><span>HighLevel opportunities</span><b id="sent">—</b></div></section><div class="toolbar"><input id="search" placeholder="Search name, phone, email, source…"><select id="stage"><option value="">All pipeline stages</option></select><button class="btn primary" id="refresh">Refresh</button><span class="status" id="status"></span></div><section class="pipeline" id="pipeline"></section><section class="card table-card"><h2>Recent website submissions</h2><div id="table"></div></section></div></main><script>
const API='https://htfo-service-operations.onrender.com/api/service',stages=['New Lead','Contacted','Appointment','Visited Showroom','Quoted','Sold','Lost'],$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let token=localStorage.getItem('htfo_crm_token')||'',user=null,leads=[];
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`,...(opts.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`Request failed (${r.status})`);return j}function showLogin(msg=''){token='';localStorage.removeItem('htfo_crm_token');$('#app').style.display='none';$('#login').style.display='grid';$('#loginError').textContent=msg}async function start(){if(!token)return showLogin();try{const me=await api('/me');user=me.user;$('#who').textContent=`${user.name||user.username} · Live website leads · Monroeville & Wexford`;$('#login').style.display='none';$('#app').style.display='block';await load()}catch(e){showLogin(e.message)}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';const d=Object.fromEntries(new FormData(e.target));try{const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)throw new Error(j.error||'Login failed');token=j.token;localStorage.setItem('htfo_crm_token',token);await start()}catch(err){$('#loginError').textContent=err.message}};$('#logout').onclick=()=>showLogin();$('#refresh').onclick=load;$('#search').oninput=render;$('#stage').onchange=render;
function filtered(){const q=$('#search').value.trim().toLowerCase(),stage=$('#stage').value;return leads.filter(x=>(!stage||x.pipeline_stage===stage)&&(!q||[x.first_name,x.last_name,x.email,x.phone,x.source,x.note].join(' ').toLowerCase().includes(q)))}async function move(id,stage){try{await api('/crm/leads/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({pipeline_stage:stage})});const x=leads.find(v=>v.submission_id===id);if(x)x.pipeline_stage=stage;render();await dashboard()}catch(e){alert(e.message)}}
function leadCard(x){const contact=x.ghl_contact_status==='sent',opp=x.ghl_opportunity_status==='sent';return `<article class="lead"><strong>${esc(x.first_name)} ${esc(x.last_name)}</strong><div class="meta">${esc(x.phone||'No phone')}<br>${esc(x.email||'No email')}<br>${esc(x.source)}</div><div class="delivery"><span class="${contact?'ok':'bad'}">HighLevel contact ${contact?'✓':'⚠'}</span> · <span class="${opp?'ok':'bad'}">opportunity ${opp?'✓':'⚠'}</span></div><select data-move="${esc(x.submission_id)}">${stages.map(s=>`<option ${s===x.pipeline_stage?'selected':''}>${s}</option>`).join('')}</select></article>`}function render(){const rows=filtered();$('#pipeline').innerHTML=stages.map(s=>{const items=rows.filter(x=>x.pipeline_stage===s);return `<div class="column"><h2>${s}<span class="count">${items.length}</span></h2>${items.map(leadCard).join('')||'<div class="empty">No leads</div>'}</div>`}).join('');document.querySelectorAll('[data-move]').forEach(el=>el.onchange=()=>move(el.dataset.move,el.value));$('#table').innerHTML=rows.length?`<table><thead><tr><th>Received</th><th>Lead</th><th>Source</th><th>Stage</th><th>HighLevel</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${new Date(x.received_at).toLocaleString()}</td><td><b>${esc(x.first_name)} ${esc(x.last_name)}</b><br>${esc(x.phone||'')}<br>${esc(x.email||'')}</td><td>${esc(x.source)}</td><td>${esc(x.pipeline_stage)}</td><td>${x.ghl_contact_status==='sent'?'Contact ✓':'Contact ⚠'}<br>${x.ghl_opportunity_status==='sent'?'Opportunity ✓':'Opportunity ⚠'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No matching leads.</div>';$('#status').textContent=`${rows.length} shown · Updated ${new Date().toLocaleTimeString()}`}
async function dashboard(){const d=await api('/crm/dashboard');$('#open').textContent=d.totals.open;$('#day').textContent=d.totals.last_24_hours;$('#week').textContent=d.totals.last_7_days;$('#sent').textContent=d.delivery.opportunities_sent}async function load(){try{$('#status').textContent='Loading…';const [r]=await Promise.all([api('/crm/leads?limit=500'),dashboard()]);leads=r;render()}catch(e){if(/login|session/i.test(e.message))showLogin(e.message);else $('#status').textContent=e.message}}stages.forEach(s=>$('#stage').insertAdjacentHTML('beforeend',`<option>${s}</option>`));start();
</script></body></html>
